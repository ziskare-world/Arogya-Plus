<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Arogya Plus - Offline</title>
  <link rel="stylesheet" href="/css/global.css" />
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #f8fafc;
    }

    .offline-card {
      width: 100%;
      max-width: 520px;
      text-align: center;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 24px;
      box-shadow: var(--shadow-sm);
    }

    .offline-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 14px;
      border-radius: 16px;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 28px;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <main class="offline-card">
    <div class="offline-icon">+</div>
    <h2>You're Offline</h2>
    <p style="margin-top:8px">Arogya Plus could not reach the network. Reconnect and refresh to continue.</p>
    <button class="btn btn-primary" style="margin-top:16px" onclick="location.reload()">Try Again</button>
  </main>
</body>

</html>
