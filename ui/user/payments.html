<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Arogya Plus - Payments</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/user.css" />
    <link rel="stylesheet" href="../css/dashboard.css">
</head>

<body>
    <div id="toast-container"></div>
    <div class="app-layout">
        <div class="main-area">
            <div id="topbar-container"></div>
            <main class="page-content">
                <div class="page-header">
                    <h2>Payments & Billing</h2>
                </div>
                <div class="stat-grid" style="margin-top:20px">
                    <div class="stat-card red">
                        <div id="balance-due" class="stat-value">INR 0</div>
                        <div class="stat-label">Balance Due</div>
                    </div>
                    <div class="stat-card green">
                        <div id="total-paid" class="stat-value">INR 0</div>
                        <div class="stat-label">Total Paid</div>
                    </div>
                </div>
                <div class="card" style="margin-top:24px">
                    <div class="card-header">
                        <div class="card-title">Billing History</div>
                    </div>
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Description</th>
                                    <th>Amount</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="payments-body"></tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script type="module" src="../backend-js/user-payments.js"></script>
</body>

</html>
