<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Arogya Plus - System Audit Logs</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
</head>

<body>
    <div id="toast-container"></div>
    <div class="app-layout">
        <div class="main-area">
            <div id="topbar-container"></div>
            <main class="page-content">
                <div class="page-header flex-between">
                    <div>
                        <h2>System Audit Logs & Security Traces</h2>
                        <p style="color:var(--text-400);font-size:0.88rem">Immutable real-time audit ledger tracking security, patient registrations, clinical care, and transactions</p>
                    </div>
                    <div style="display:flex;gap:10px">
                        <button class="btn btn-outline" id="btn-export-logs">📥 Export CSV</button>
                        <button class="btn btn-secondary" onclick="reloadAuditLogs()">🔄 Refresh</button>
                    </div>
                </div>

                <!-- FILTER BAR -->
                <div class="card" style="margin-bottom:20px;padding:16px;">
                    <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;">
                        <div style="flex:1;min-width:240px;">
                            <input type="text" id="log-search" class="form-input" placeholder="🔍 Search action, details, actor, IP..." style="width:100%" oninput="onFilterChange()" />
                        </div>
                        <div>
                            <select id="log-category" class="form-input" onchange="onFilterChange()" style="min-width:140px">
                                <option value="All">All Categories</option>
                                <option value="AUTH">AUTH</option>
                                <option value="PATIENT">PATIENT</option>
                                <option value="APPOINTMENT">APPOINTMENT</option>
                                <option value="EMERGENCY">EMERGENCY</option>
                                <option value="PAYMENT">PAYMENT</option>
                                <option value="LAB">LAB</option>
                                <option value="SYSTEM">SYSTEM</option>
                            </select>
                        </div>
                        <div>
                            <select id="log-severity" class="form-input" onchange="onFilterChange()" style="min-width:130px">
                                <option value="All">All Severities</option>
                                <option value="info">Info</option>
                                <option value="warning">Warning</option>
                                <option value="critical">Critical</option>
                                <option value="error">Error</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>Timestamp</th>
                                    <th>Severity</th>
                                    <th>Category</th>
                                    <th>Action</th>
                                    <th>Event Details</th>
                                    <th>Actor</th>
                                    <th>IP Address</th>
                                </tr>
                            </thead>
                            <tbody id="logs-tbody">
                                <tr>
                                    <td colspan="7" style="text-align:center;color:var(--text-400);padding:30px">Loading audit ledger...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script type="module" src="../backend-js/super-admin-system-logs.js"></script>
</body>

</html>
