<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Arogya Plus - Settings | Super Admin</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
</head>

<body>
    <div id="toast-container"></div>
    <div class="app-layout">
        <div class="main-area">
            <div id="topbar-container"></div>

            <main class="page-content" style="padding:24px">
                <div class="page-header" style="margin-bottom:20px">
                    <div>
                        <h2>⚙️ Security & Accessibility Settings</h2>
                        <p>Global oversight controls for system security, accessibility preferences, and hospital network parameters.</p>
                    </div>
                </div>

                <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(320px, 1fr));gap:20px">
                    
                    <!-- Security & Access Control Settings -->
                    <div class="card" style="padding:20px">
                        <h3 style="margin-bottom:12px;font-size:1.05rem">🔒 Security & Access Policies</h3>
                        <form id="settings-security-form" style="display:flex;flex-direction:column;gap:14px">
                            <div class="form-group">
                                <label class="form-label" for="setting-session-timeout">Admin Session Timeout</label>
                                <select id="setting-session-timeout" class="form-input">
                                    <option value="24h">24 Hours (Default)</option>
                                    <option value="12h">12 Hours</option>
                                    <option value="8h">8 Hours</option>
                                    <option value="1h">1 Hour (Strict Security)</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="setting-rate-limit">API Rate Limiting Policy</label>
                                <select id="setting-rate-limit" class="form-input">
                                    <option value="strict">Strict - 100 requests / 15 mins</option>
                                    <option value="relaxed">Relaxed - 300 requests / 15 mins</option>
                                    <option value="disabled">Disabled (Development Mode)</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="setting-2fa">Two-Factor Authentication (2FA)</label>
                                <select id="setting-2fa" class="form-input">
                                    <option value="false">Optional for Hospital Admins</option>
                                    <option value="true">Mandatory for All Admins & Doctors</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="setting-max-login-attempts">Account Lockout Threshold</label>
                                <select id="setting-max-login-attempts" class="form-input">
                                    <option value="3">3 Failed Attempts (High Security)</option>
                                    <option value="5" selected>5 Failed Attempts (Standard)</option>
                                    <option value="10">10 Failed Attempts</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="setting-ip-restriction">Restricted IP Access Control</label>
                                <select id="setting-ip-restriction" class="form-input">
                                    <option value="false">Allow Access from Any Location</option>
                                    <option value="true">Restrict to Whitelisted IP Ranges Only</option>
                                </select>
                            </div>

                            <button class="btn btn-primary btn-sm" type="submit" style="align-self:flex-end">Save Security Policies</button>
                        </form>
                    </div>

                    <!-- Accessibility Controls -->
                    <div class="card" style="padding:20px">
                        <h3 style="margin-bottom:12px;font-size:1.05rem">♿ Accessibility & UI Preferences</h3>
                        <form id="settings-accessibility-form" style="display:flex;flex-direction:column;gap:14px">
                            <div class="form-group">
                                <label class="form-label" for="setting-high-contrast">High Contrast UI Mode</label>
                                <select id="setting-high-contrast" class="form-input">
                                    <option value="false">Disabled (Standard Dark Mode)</option>
                                    <option value="true">Enabled (High Contrast Colors)</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="setting-font-scale">Font Size Scaling</label>
                                <select id="setting-font-scale" class="form-input">
                                    <option value="standard">Standard (100%)</option>
                                    <option value="medium">Medium (115%)</option>
                                    <option value="large">Large (130% High Legibility)</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="setting-reduced-motion">Animation & UI Motion Control</label>
                                <select id="setting-reduced-motion" class="form-input">
                                    <option value="false">Enable Micro-Animations</option>
                                    <option value="true">Disable Animations (Reduced Motion)</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="setting-screen-reader">Screen Reader Optimization</label>
                                <select id="setting-screen-reader" class="form-input">
                                    <option value="true">Enabled (ARIA Standards)</option>
                                    <option value="false">Standard</option>
                                </select>
                            </div>

                            <button class="btn btn-primary btn-sm" type="submit" style="align-self:flex-end">Save Accessibility Settings</button>
                        </form>
                    </div>

                    <!-- Network & Storage Preferences -->
                    <div class="card" style="padding:20px">
                        <h3 style="margin-bottom:12px;font-size:1.05rem">🏥 Hospital Network & Storage</h3>
                        <form id="settings-network-form" style="display:flex;flex-direction:column;gap:14px">
                            <div class="form-group">
                                <label class="form-label" for="setting-default-currency">Default Currency</label>
                                <select id="setting-default-currency" class="form-input">
                                    <option value="INR">INR (₹)</option>
                                    <option value="USD">USD ($)</option>
                                    <option value="EUR">EUR (€)</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="setting-auto-approval">Hospital Admin Registration Mode</label>
                                <select id="setting-auto-approval" class="form-input">
                                    <option value="manual">Require Super Admin Manual Verification</option>
                                    <option value="auto">Automatic Account Provisioning</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="setting-platform-title">Hospital Platform Title</label>
                                <input id="setting-platform-title" class="form-input" type="text" value="Arogya Plus Healthcare Platform" />
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="setting-storage-quota">Default Hospital Storage Quota</label>
                                <select id="setting-storage-quota" class="form-input">
                                    <option value="5GB">5 GB per Hospital (Standard)</option>
                                    <option value="10GB">10 GB per Hospital</option>
                                    <option value="50GB">50 GB Enterprise Quota</option>
                                </select>
                            </div>

                            <button class="btn btn-primary btn-sm" type="submit" style="align-self:flex-end">Save Network Settings</button>
                        </form>
                    </div>

                    <!-- Hospital Bed Capacity & Occupancy Settings -->
                    <div class="card" style="padding:20px">
                        <h3 style="margin-bottom:12px;font-size:1.05rem">🛏️ Hospital Bed Capacity & Occupancy</h3>
                        <form id="settings-bed-form" style="display:flex;flex-direction:column;gap:14px">
                            <div class="form-group">
                                <label class="form-label" for="setting-total-beds">Total Hospital Beds Capacity</label>
                                <input id="setting-total-beds" class="form-input" type="number" min="0" value="0" placeholder="0 (Default)" required />
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="setting-occupied-beds">Currently Occupied Beds</label>
                                <input id="setting-occupied-beds" class="form-input" type="number" min="0" value="0" placeholder="0 (Default)" required />
                            </div>

                            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
                                <div class="form-group">
                                    <label class="form-label" for="setting-icu-beds-total">Total ICU Beds</label>
                                    <input id="setting-icu-beds-total" class="form-input" type="number" min="0" value="0" placeholder="0" required />
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="setting-icu-beds-occupied">Occupied ICU Beds</label>
                                    <input id="setting-icu-beds-occupied" class="form-input" type="number" min="0" value="0" placeholder="0" required />
                                </div>
                            </div>

                            <button class="btn btn-primary btn-sm" type="submit" style="align-self:flex-end">Save Bed Settings</button>
                        </form>
                    </div>

                </div>
            </main>
        </div>
    </div>

    <script type="module" src="../backend-js/super-admin-settings.js"></script>
</body>

</html>
