<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Arogya Plus - Doctor Appointments</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>

<body>
    <div id="toast-container"></div>
    <div class="app-layout">
        <!-- Sidebar injected by JS -->
        <div class="main-area">
            <div id="topbar-container"></div>
            <main class="page-content">
                <div class="page-header">
                    <h2>Daily Schedule & Patient Location Navigation</h2>
                    <div style="display:flex;gap:8px">
                        <button class="btn btn-outline btn-sm">Today</button>
                        <button class="btn btn-outline btn-sm">Weekly</button>
                    </div>
                </div>

                <!-- Patient Navigation & Live Tracking Map -->
                <div class="card" style="margin-bottom:20px">
                    <div class="card-header">
                        <div class="card-title">📍 Assigned Patient Navigation & Live Ambulance Tracker</div>
                    </div>
                    <div id="doctor-patient-map" style="width:100%;height:320px;border-radius:8px;background:#f8fafc;"></div>
                </div>

                <!-- Schedule rendering -->
                <div class="card" style="margin-top:20px">
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>Time</th>
                                    <th>Patient</th>
                                    <th>Symptoms</th>
                                    <th>Type</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td colspan="5" style="text-align:center;color:var(--text-500)">Loading appointments...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="../js/map.js?v=20260913_4"></script>
    <script src="../js/routing.js?v=20260913_4"></script>
    <script src="../js/geolocation.js?v=20260913_4"></script>
    <script src="../js/hospital.js?v=20260913_4"></script>
    <script src="../js/ambulance.js?v=20260913_4"></script>
    <script src="../js/emergency.js?v=20260913_4"></script>
    <script type="module" src="../backend-js/doctor-appointments.js?v=20260913_4"></script>
    <script type="module" src="/js/ai-chat-widget.js?v=20260913_4"></script>

</body>

</html>
