<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Arogya Plus - Doctors</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
    <style>
        .doctor-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            padding: 24px;
            text-align: center;
            transition: all var(--t-mid);
            cursor: pointer;
        }

        .doctor-card:hover {
            border-color: var(--blue);
            transform: translateY(-4px);
            box-shadow: var(--shadow);
        }

        .doc-avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            margin: 0 auto 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            border: 2px solid var(--border);
        }

        .doc-stars {
            color: #eab308;
            font-size: .8rem;
            margin: 6px 0;
        }

        .doc-stat {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .ds-val {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-100);
        }

        .ds-lbl {
            font-size: .65rem;
            color: var(--text-500);
        }

        .lightbox-modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .lightbox-content {
            width: 100%;
            max-width: 520px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            box-shadow: var(--shadow-lg);
            padding: 24px;
        }
    </style>
</head>

<body>
    <div id="toast-container"></div>
    <div class="app-layout">

        <!-- Sidebar injected by JS -->
        <div class="main-area">
            <div id="topbar-container"></div>

            <main class="page-content">
                <div class="page-header flex-between">
                    <div>
                        <h2>Medical Staff</h2>
                        <p>36 doctors registered - 12 currently online</p>
                    </div>
                    <button class="btn btn-primary" id="open-add-doctor-modal-btn" onclick="openAddDoctorModal()">+ Add Doctor</button>
                </div>

                <div class="stat-grid" style="margin-bottom:24px">
                    <div class="stat-card blue card-sm">
                        <div class="stat-value">0</div>
                        <div class="stat-label">Total Doctors</div>
                    </div>
                    <div class="stat-card green card-sm">
                        <div class="stat-value">0</div>
                        <div class="stat-label">Online Now</div>
                    </div>
                    <div class="stat-card cyan card-sm">
                        <div class="stat-value">0.0</div>
                        <div class="stat-label">Avg. Rating</div>
                    </div>
                    <div class="stat-card purple card-sm">
                        <div class="stat-value">0</div>
                        <div class="stat-label">Specializations</div>
                    </div>
                </div>

                <!-- Filter chips -->
                <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px" id="spec-filters">
                    <button class="btn btn-outline btn-sm active" onclick="filterSpec('',this)">All</button>
                    <button class="btn btn-outline btn-sm" onclick="filterSpec('Cardiologist',this)">
                        Cardiology</button>
                    <button class="btn btn-outline btn-sm" onclick="filterSpec('Neurologist',this)">
                        Neurology</button>
                    <button class="btn btn-outline btn-sm" onclick="filterSpec('Pediatrician',this)">
                        Pediatrician</button>
                    <button class="btn btn-outline btn-sm" onclick="filterSpec('Orthopedist',this)">
                        Orthopedics</button>
                    <button class="btn btn-outline btn-sm" onclick="filterSpec('Dermatologist',this)">
                        Dermatology</button>
                </div>

                <div class="grid-auto" id="doc-grid"></div>
            </main>
        </div>
    </div>

    <!-- ADD DOCTOR POPUP MODAL -->
    <div id="add-doctor-modal" class="lightbox-modal">
        <div class="lightbox-content" style="width:480px">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
                <h3 style="margin:0">👨‍⚕️ Add New Doctor</h3>
                <button class="btn btn-ghost btn-sm" id="close-doctor-modal-btn">✕</button>
            </div>

            <form id="add-doctor-form" style="display:flex;flex-direction:column;gap:12px">
                <div class="form-group">
                    <label class="form-label" for="doc-name">Doctor Full Name *</label>
                    <input type="text" id="doc-name" class="form-input" placeholder="e.g. Dr. Rajesh Kumar" required>
                </div>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
                    <div class="form-group">
                        <label class="form-label" for="doc-email">Email Address *</label>
                        <input type="email" id="doc-email" class="form-input" placeholder="doctor@hospital.com" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="doc-password">Account Password *</label>
                        <input type="password" id="doc-password" class="form-input" minlength="6" placeholder="Min 6 chars" required>
                    </div>
                </div>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
                    <div class="form-group">
                        <label class="form-label" for="doc-spec">Specialization *</label>
                        <select id="doc-spec" class="form-input" required>
                            <option value="">Select Specialization</option>
                            <option value="Cardiologist">Cardiology</option>
                            <option value="Neurologist">Neurology</option>
                            <option value="Pediatrician">Pediatrician</option>
                            <option value="Orthopedist">Orthopedics</option>
                            <option value="Dermatologist">Dermatology</option>
                            <option value="General Physician">General Physician</option>
                            <option value="Surgeon">General Surgeon</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="doc-hospital">Assigned Hospital *</label>
                        <select id="doc-hospital" class="form-input" required>
                            <option value="">Loading Hospitals...</option>
                        </select>
                    </div>
                </div>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
                    <div class="form-group">
                        <label class="form-label" for="doc-phone">Phone Number</label>
                        <input type="text" id="doc-phone" class="form-input" placeholder="+91 9876543210">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="doc-clinic">Clinic / Dept Address</label>
                        <input type="text" id="doc-clinic" class="form-input" placeholder="e.g. OPD Room 204">
                    </div>
                </div>

                <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px">
                    <button type="button" class="btn btn-ghost btn-sm" id="cancel-doctor-modal-btn">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-sm" id="submit-doctor-btn">Create Doctor Account</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="../backend-js/super-admin-doctors.js"></script>
</body>

</html>
