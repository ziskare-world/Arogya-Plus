<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Arogya Plus - Doctor Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
</head>

<body>
    <div id="toast-container"></div>
    <div class="app-layout">
        <!-- Sidebar injected by JS -->
        <div class="main-area">
            <div id="topbar-container"></div>

            <main class="page-content">
                <div class="page-header">
                    <div>
                        <h2 id="doctor-greeting">Good Morning, Doctor</h2>
                        <p>Loading your consultation schedule...</p>
                    </div>
                </div>

                <div class="stat-grid">
                    <div class="stat-card blue">
                        <div class="stat-value">0</div>
                        <div class="stat-label">Today's Visits</div>
                    </div>
                    <div class="stat-card green">
                        <div class="stat-value">0</div>
                        <div class="stat-label">Completed Consults</div>
                    </div>
                    <div class="stat-card red">
                        <div class="stat-value">0</div>
                        <div class="stat-label">Urgent Reviews</div>
                    </div>
                </div>

                <div class="card" style="margin-top:24px">
                    <div class="card-header">
                        <div class="card-title">Upcoming Schedule</div>
                    </div>
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>Time</th>
                                    <th>Patient</th>
                                    <th>Type</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td colspan="5" style="text-align:center;color:var(--text-500)">Loading schedule...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script type="module" src="../backend-js/doctor-dashboard.js"></script>
</body>

</html>
