<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Arogya Plus - Prescriptions</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
</head>

<body>
    <div id="toast-container"></div>
    <div class="app-layout">
        <!-- Sidebar injected by JS -->
        <div class="main-area">
            <div id="topbar-container"></div>
            <main class="page-content">
                <div class="page-header">
                    <h2>Issue Prescription</h2>
                </div>
                <div class="card" style="margin-top:20px;max-width:600px">
                    <div class="form-group"><label class="form-label">Patient</label>
                        <select class="form-input">
                            <option>John Doe (PAT-1042)</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin-top:12px"><label class="form-label">Medication</label><input
                            class="form-input" placeholder="e.g. Lisinopril 10mg" /></div>
                    <div class="form-group" style="margin-top:12px"><label class="form-label">Dosage</label><input
                            class="form-input" placeholder="e.g. Once daily" /></div>
                    <button class="btn btn-primary" style="margin-top:20px;width:100%"
                        onclick="toast('Prescription issued!','success')">Sign & Send</button>
                </div>
            </main>
        </div>
    </div>
    <script type="module" src="../backend-js/doctor-prescriptions.js"></script>
    <script type="module" src="/js/ai-chat-widget.js"></script>
</body>

</html>
