<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Arogya Plus - User Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../css/user.css" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
</head>

<body>
    <div id="toast-container"></div>
    <div class="app-layout">
        <div class="main-area">
            <div id="topbar-container"></div>

            <main class="page-content">
                <div class="page-header">
                    <div>
                        <h2 id="welcome-title"></h2>
                        <p id="dashboard-subtitle"></p>
                    </div>
                </div>

                <!-- Emergency SOS Alert Banner -->
                <div style="background:linear-gradient(135deg, #ef4444 0%, #dc2626 100%);color:#fff;border-radius:12px;padding:16px 20px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;box-shadow:0 4px 14px rgba(239,68,68,0.3)">
                    <div style="display:flex;align-items:center;gap:12px">
                        <div style="font-size:1.8rem;line-height:1">🚑</div>
                        <div>
                            <div style="font-weight:800;font-size:1.05rem">Emergency Medical SOS</div>
                            <div style="font-size:0.85rem;opacity:0.9">Need immediate ambulance dispatch or critical emergency care?</div>
                        </div>
                    </div>
                    <button class="btn" style="background:#fff;color:#dc2626;font-weight:700;border:none;padding:10px 18px;border-radius:8px;cursor:pointer" onclick="location.href='ambulance-booking.html'">Request Emergency Ambulance</button>
                </div>

                <!-- Quick Actions Bar -->
                <div class="card" style="margin-bottom:24px;padding:16px">
                    <div style="font-weight:700;font-size:0.9rem;margin-bottom:12px;color:var(--text-1)">Quick Actions</div>
                    <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));gap:12px">
                        <button class="btn btn-outline" style="justify-content:center;gap:8px" onclick="location.href='appointments.html'">
                            📅 Book Appointment
                        </button>
                        <button class="btn btn-outline" style="justify-content:center;gap:8px" onclick="if (window.openAiDoctorExplorer) { window.openAiDoctorExplorer(); } else { location.href='doctors.html'; }">
                            🩺 Explore Doctors (AI)
                        </button>
                        <button class="btn btn-outline" style="justify-content:center;gap:8px" onclick="location.href='insurance.html'">
                            🛡️ Insurance Claims
                        </button>
                        <button class="btn btn-outline" style="justify-content:center;gap:8px" onclick="location.href='payments.html'">
                            💳 Pay Balance
                        </button>
                    </div>
                </div>

                <div class="grid-4" style="margin-bottom:24px">
                    <div class="stat-card blue">
                        <div class="stat-icon">Appointments</div>
                        <div id="stat-appointments" class="stat-value">0</div>
                        <div class="stat-label">Next Appointments</div>
                    </div>
                    <div class="stat-card red">
                        <div class="stat-icon">Prescriptions</div>
                        <div id="stat-refills" class="stat-value">0</div>
                        <div class="stat-label">Refill Due</div>
                    </div>
                    <div class="stat-card green">
                        <div class="stat-icon">Medical Records</div>
                        <div id="stat-records" class="stat-value">0</div>
                        <div class="stat-label">Recent Records</div>
                    </div>
                    <div class="stat-card purple">
                        <div class="stat-icon">INR</div>
                        <div id="stat-balance" class="stat-value">0</div>
                        <div class="stat-label">Balance Due</div>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">Next Appointment</div>
                            <button class="btn btn-ghost btn-sm" onclick="location.href='appointments.html'">View All</button>
                        </div>
                        <div
                            style="padding:16px;background:#f8fafc;border-radius:12px;display:flex;align-items:center;gap:12px">
                            <div
                                style="width:48px;height:48px;border-radius:50%;background:#eff6ff;display:flex;align-items:center;justify-content:center;font-size:1rem">
                                <span id="next-avatar">--</span>
                            </div>
                            <div style="flex:1">
                                <div id="next-doctor" style="font-weight:700;color:var(--text-1)"></div>
                                <div id="next-details" class="muted"></div>
                            </div>
                            <span id="next-status" class="badge badge-blue"></span>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">Recent Activity</div>
                        </div>
                        <div id="recent-activity" style="display:flex;flex-direction:column;gap:12px"></div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script type="module" src="../backend-js/user-dashboard.js"></script>
</body>

</html>
