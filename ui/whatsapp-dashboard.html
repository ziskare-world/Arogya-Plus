<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>WhatsApp Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #e2e8f0;
      margin: 0;
      overflow: hidden;
    }
    .whatsapp-wrapper {
      display: flex;
      height: 100vh;
    }
    #contact-list {
      width: 260px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      overflow-y: auto;
      border-right: 1px solid rgba(255,255,255,0.1);
    }
    .contact-item {
      padding: 12px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 0.2s;
    }
    .contact-item:hover {
      background: rgba(255,255,255,0.08);
    }
    .contact-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #64748b;
      flex-shrink: 0;
    }
    #chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column-reverse; /* newest at bottom */
    }
    .msg {
      max-width: 70%;
      margin: 4px 0;
      padding: 8px 12px;
      border-radius: 12px;
      line-height: 1.4;
      word-break: break-word;
    }
    .msg.sent { align-self: flex-end; background: #2563eb; color: #fff; }
    .msg.received { align-self: flex-start; background: rgba(255,255,255,0.1); color: #e2e8f0; }
    #load-older {
      background: rgba(255,255,255,0.1);
      color: #e2e8f0;
      border: none;
      padding: 8px 12px;
      margin: 8px auto;
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.2s;
    }
    #load-older:hover { background: rgba(255,255,255,0.2); }
    #qr-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
    }
    #qr-box {
      background: rgba(255,255,255,0.09);
      padding: 24px;
      border-radius: 12px;
      text-align: center;
      backdrop-filter: blur(12px);
    }
    #qr-box img { width: 240px; height: 240px; }
  </style>
</head>
<body>
  <div class="whatsapp-wrapper">
    <div id="contact-list"></div>
    <div id="chat-panel">
      <button id="load-older" style="display:none;">Load older messages</button>
      <div id="messages"></div>
    </div>
  </div>
  <div id="qr-overlay" style="display:none;">
    <div id="qr-box">
      <h3>Scan QR to connect WhatsApp</h3>
      <img id="qr-img" src="" alt="QR Code" />
      <p>Open WhatsApp on your phone → Settings → Linked Devices → Scan QR.</p>
    </div>
  </div>
  <script type="module" src="../js/whatsapp-dashboard.js"></script>
</body>
</html>
