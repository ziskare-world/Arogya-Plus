<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Arogya Plus - My Patients</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
</head>

<body>
    <div id="toast-container"></div>
    <div class="app-layout">
        <!-- Sidebar injected by JS -->
        <div class="main-area">
            <div id="topbar-container"></div>
            <main class="page-content">
                <div class="page-header">
                    <h2>My Patients</h2>
                    <input class="form-input" style="width:240px" placeholder="Search patients..." />
                </div>
                <div class="grid-auto" style="margin-top:20px">
                    <div class="card">
                        <div style="display:flex;align-items:center;gap:12px">
                            <div
                                style="width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700">
                                JD</div>
                            <div>
                                <div style="font-weight:700">John Doe</div>
                                <div class="muted">Patient ID: PAT-1042</div>
                            </div>
                        </div>
                        <div style="margin-top:12px">
                            <span class="badge badge-red">Hypertension</span>
                            <span class="badge badge-blue">Type 2 Diabetes</span>
                        </div>
                        <button class="btn btn-outline btn-full btn-sm" style="margin-top:14px">View History</button>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script type="module" src="../backend-js/doctor-patients.js"></script>
</body>

</html>
